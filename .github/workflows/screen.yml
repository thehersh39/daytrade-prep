name: Morning screen
on:
  schedule:
    # 9:05 and 9:50 UTC on weekdays = 4:05/4:50 AM CDT, 3:05/3:50 AM CST
    - cron: "5 9 * * 1-5"
    - cron: "50 9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["screen.py", ".github/workflows/screen.yml", "requirements.txt"]
permissions:
  contents: write
concurrency:
  group: screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python screen.py
      - name: Commit data
        run: |
          git config user.name "daytrade-prep bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json status.json
          git commit -m "Morning screen $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main && git push origin HEAD:main
