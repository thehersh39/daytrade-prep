name: Morning screen
on:
  schedule:
    # GitHub's timed runs can start late or get skipped, so try many times.
    # Evening backup (10:13 PM CT, Mon-Thu nights + Sun night) guarantees prior-close levels exist.
    - cron: "13 3 * * 1-5"
    # Every 20 min from 08:07 to 10:47 UTC on weekdays = 3:07-5:47 AM CDT / 2:07-4:47 AM CST,
    # so premarket quotes and overnight news are as fresh as possible before the 5:17 AM CT email.
    - cron: "7,27,47 8-10 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["screen.py", ".github/workflows/screen.yml", "requirements.txt"]
permissions:
  contents: write
concurrency:
  group: screen
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python screen.py
      - name: Commit data
        run: |
          git config user.name "daytrade-prep bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json status.json
          git commit -m "Morning screen $(date -u +%Y-%m-%dT%H:%MZ)" || echo "no changes"
          git pull --rebase origin main && git push origin HEAD:main
